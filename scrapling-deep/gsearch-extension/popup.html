<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 12px; color: #1f1f1f; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; gap: 8px; }
  .k { color: #666; }
  .v { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
  .on { color: #137333; font-weight: 600; } .off { color: #b3261e; font-weight: 600; }
  input { width: 70px; } button { margin-top: 8px; }
</style>
</head>
<body>
  <div class="row"><span class="k">Worker</span><span id="conn" class="v">…</span></div>
  <div class="row"><span class="k">Searches</span><span id="count" class="v">0</span></div>
  <div class="row"><span class="k">Last query</span><span id="last" class="v">–</span></div>
  <div class="row"><span class="k">Last error</span><span id="err" class="v">–</span></div>
  <div class="row"><span class="k">Port</span><input id="port" type="number" min="1" max="65535"></div>
  <button id="reconnect">Reconnect</button>
  <script src="popup.js"></script>
</body>
</html>
